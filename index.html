<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Video Downloader</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #010101 0%, #121212 100%);
            color: #fff;
            display: flex;
            flex-direction: column; /* Allows top banner, card, and bottom banner to stack nicely */
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 40px;
            border-radius: 20px;
            width: 100%;
            max-width: 600px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        .logo {
            font-size: 2rem;
            font-weight: 800;
            margin-bottom: 10px;
            letter-spacing: -1px;
        }

        .logo span:nth-child(1) {
            color: #00f2fe;
            text-shadow: -2px -2px 0 #fe2c55;
            margin-right: 10px;
        }

        .logo span:nth-child(2) {
            color: #fff;
        }

        .tagline {
            color: #aaa;
            font-size: 1rem;
            margin-bottom: 30px;
        }

        .input-group {
            position: relative;
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 100%;
            padding: 18px 20px;
            background: rgba(255, 255, 255, 0.08);
            border: 2px solid transparent;
            border-radius: 12px;
            color: #fff;
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
        }

        input[type="text"]:focus {
            border-color: #fe2c55;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 15px rgba(254, 44, 85, 0.3);
        }

        input[type="text"]::placeholder {
            color: #777;
        }

        button {
            width: 100%;
            padding: 16px;
            background: linear-gradient(45deg, #fe2c55, #00f2fe);
            background-size: 200% auto;
            border: none;
            border-radius: 12px;
            color: #fff;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.5s;
            box-shadow: 0 5px 15px rgba(254, 44, 85, 0.4);
        }

        button:hover {
            background-position: right center;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        /* Title styling */
        #videoTitle {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 20px;
            text-align: center;
            line-height: 1.4;
            word-break: break-word;
        }

        /* Result Wrapper Styling */
        #resultContainer {
            margin-top: 25px;
            padding: 25px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            display: none; /* Controlled by JS */
            width: 100%;
        }

        /* 4 Button Grid Stack layout */
        .button-stack {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .file-download-btn {
            display: block;
            width: 100%;
            padding: 14px 20px;
            color: #fff;
            text-decoration: none;
            font-weight: 700;
            font-size: 1rem;
            border-radius: 12px;
            transition: all 0.3s ease;
            text-align: center;
        }

        /* Custom colors for buttons to differentiate them */
        .btn-primary {
            background: #fe2c55;
            box-shadow: 0 4px 12px rgba(254, 44, 85, 0.3);
        }
        .btn-primary:hover {
            background: #e11d43;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .btn-accent {
            background: #00f2fe;
            color: #000;
            box-shadow: 0 4px 12px rgba(0, 242, 254, 0.3);
        }
        .btn-accent:hover {
            background: #00d8e4;
            transform: translateY(-2px);
        }

        .features {
            margin-top: 40px;
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 30px;
        }

        .feature-item {
            font-size: 0.85rem;
            color: #bbb;
        }

        .feature-item icon {
            display: block;
            font-size: 1.5rem;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <!-- Top Banner Ad -->
    <div style="margin: 0 0 25px 0; display:flex; justify-content:center; width: 100%; max-width: 728px;">
        <script>
            atOptions = {
                'key' : '136c97f4f3f5b7a91571a982079fb451',
                'format' : 'iframe',
                'height' : 90,
                'width' : 728,
                'params' : {}
            };
        </script>
        <script src="https://socialconventcontext.com/136c97f4f3f5b7a91571a982079fb451/invoke.js"></script>
    </div>

    <!-- Main Content Container -->
    <div class="container">
        <div class="logo">
            <span>TikTok</span><span>Downloader</span>
        </div>
        <p class="tagline">Download TikTok videos without watermark and high quality.</p>
        
        <div class="input-group">
            <input type="text" id="videoUrl" placeholder="Paste TikTok video link here...">
            <button id="downloadBtn">Download Video</button>
        </div>

        <!-- Result section containing the title and 4 separate download links -->
        <div id="resultContainer">
            <p id="videoTitle"></p>
            <div class="button-stack">
                <a id="btnNoWatermark" href="#" target="_blank" class="file-download-btn btn-primary">Download (No Watermark)</a>
                <a id="btnHD" href="#" target="_blank" class="file-download-btn btn-accent">Download HD Video</a>
                <a id="btnWatermark" href="#" target="_blank" class="file-download-btn btn-secondary">Download (With Watermark)</a>
                <a id="btnMusic" href="#" target="_blank" class="file-download-btn btn-secondary">Download Audio (MP3)</a>
            </div>
        </div>

        <div class="features">
            <div class="feature-item">
                <icon>⚡</icon>
                <p>Fast Download</p>
            </div>
            <div class="feature-item">
                <icon>✨</icon>
                <p>No Watermark</p>
            </div>
            <div class="feature-item">
                <icon>🔒</icon>
                <p>Safe & Secure</p>
            </div>
        </div>
    </div>

    <!-- Bottom Ad Unit -->
    <div style="margin: 25px 0 0 0; display:flex; justify-content:center; width: 100%; max-width: 300px;">
        <script>
            atOptions = {
                'key' : '9b81b74c7e91b4ca94aea821b7e9b5a4',
                'format' : 'iframe',
                'height' : 250,
                'width' : 300,
                'params' : {}
            };
        </script>
        <script src="https://socialconventcontext.com/9b81b74c7e91b4ca94aea821b7e9b5a4/invoke.js"></script>
    </div>

    <script>
        document.getElementById('downloadBtn').addEventListener('click', async function() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const resultContainer = document.getElementById('resultContainer');
            const videoTitle = document.getElementById('videoTitle');
            
            const btnNoWatermark = document.getElementById('btnNoWatermark');
            const btnHD = document.getElementById('btnHD');
            const btnWatermark = document.getElementById('btnWatermark');
            const btnMusic = document.getElementById('btnMusic');
            
            if (urlInput === "") {
                alert("Please paste a valid TikTok link first!");
                return;
            }

            if (!urlInput.includes("tiktok.com")) {
                alert("Invalid link! Please paste a valid TikTok video URL.");
                return; 
            }
            
            resultContainer.style.display = "none";

            try {
                const res = await fetch('https://api.azbry.com/api/download/tiktok?url=' + encodeURIComponent(urlInput));
                const json = await res.json();
                
                if (json.result && json.result.duration === null) {
                    alert("Invalid tiktok video");
                } else if (json.result) {
                    videoTitle.innerText = json.result.title || "TikTok Video";
                    const domain = "https://api.titkokdownloader352.workers.dev/"
                    const links = {
                        noWatermark: json.result.links[1],
                        hd: json.result.links[0],
                        watermark: json.result.links[2],
                        music: json.result.music.url
                    };
                    btnNoWatermark.onclick = (e) => {
                        e.preventDefault();
                        window.open("https://socialconventcontext.com/fewnurd8?key=65e8cdb99308e4ffb2e939e2103770ac");
                        window.location.href = domain + "download?url=" + links.noWatermark + "&name=" + encodeURIComponent(json.result.title) + "&type=mp4";     
                    };
                    btnHD.onclick = (e) => {
                        e.preventDefault();
                        window.open("https://socialconventcontext.com/fewnurd8?key=65e8cdb99308e4ffb2e939e2103770ac");
                        window.location.href = domain + "download?url=" + links.hd + "&name=" + encodeURIComponent(json.result.title) + "&type=mp4";     
                    };
                    btnWatermark.onclick = (e) => {
                        e.preventDefault();
                        window.location.href = domain + "download?url=" + links.watermark + "&name=" + encodeURIComponent(json.result.title) + "&type=mp4";     
                    };
                    btnMusic.onclick = (e) => {
                        e.preventDefault();
                        window.location.href = domain + "download?url=" + links.music + "&name=" + encodeURIComponent(json.result.title) + "&type=mp3";     
                    };
                    resultContainer.style.display = "block";
                } else {
                    alert("Could not load video data.");
                }
            } catch (error) {
                alert("Something went wrong processing your video.");
            }
        });
    </script>

</body>
</html>
